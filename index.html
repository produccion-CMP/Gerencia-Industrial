<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#d96b3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Gerencia Industrial · CMP</title>
  <meta name="description" content="Tablero de indicadores de Gerencia Industrial · Cerámica Marcos Paz · Planta Cevil">
  <link rel="icon" href="img/logo-cmp.png">
  <link rel="apple-touch-icon" href="img/logo-cmp.png">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('gi_tema') || 'null');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="splash">
    <span class="logo-tile"><img src="img/logo-cmp.png" alt=""></span>
    <div class="splash-emp">Grupo MP · Cerámica Marcos Paz</div>
    <h2>Gerencia Industrial</h2>
    <div class="splash-pasos" aria-hidden="true"><span>🏭</span><span>🔥</span><span>⚙️</span><span>🛠️</span><span>🚚</span></div>
    <div class="barra" id="splashBarra"><span></span></div>
    <p id="splashTxt">Conectando con las bases de datos…</p>
  </div>
  <div id="toploader"><span></span></div>

  <header class="top">
    <a class="brand" href="#/">
      <span class="logo-tile"><img src="img/logo-cmp.png" alt=""></span>
      <div>Gerencia Industrial<small id="brandPlanta">Cerámica Marcos Paz · Planta Cevil</small></div>
    </a>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="top-right">
      <span class="estado-red" id="red"><i></i><span>Conectando</span></span>
      <button class="btn ghost icon" id="btnRefrescar" title="Volver a leer las bases" aria-label="Actualizar"></button>
      <button class="btn ghost icon" id="btnImprimir" title="Imprimir o guardar PDF" aria-label="Imprimir"></button>
      <button class="btn ghost icon" id="btnTema" title="Tema claro u oscuro" aria-label="Cambiar tema"></button>
      <button class="btn sm" id="btnSesion"></button>
    </div>
  </header>

  <main id="app"></main>
  <nav class="bottom-nav" id="bnav" aria-label="Secciones"></nav>
  <div id="toasts" aria-live="polite"></div>
  <div id="overlay"><div class="ov-caja"><div class="spin"></div><p id="overlayTxt">Guardando…</p></div></div>

  <dialog id="dlg"><div class="dlg-cab"><div><div class="eyebrow" id="dlgEyebrow"></div><h2 id="dlgTitulo"></h2></div><button class="btn ghost icon" id="dlgCerrar" aria-label="Cerrar"></button></div><div class="dlg-cuerpo" id="dlgCuerpo"></div></dialog>
  <dialog id="dlgMini" class="chico"><div class="dlg-cuerpo" id="dlgMiniCuerpo"></div></dialog>
</body>
</html>
